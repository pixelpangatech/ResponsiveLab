<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResponsiveLab</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <div class="logo" style="display: flex; flex-direction: column; justify-content: center;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <h1 style="font-size: 1.25rem; margin: 0;">ResponsiveLab</h1>
      </div>
      <span style="font-size: 0.75rem; color: var(--text-secondary); margin-left: 32px; margin-top: 2px;">Test. Preview. Perfect.</span>
    </div>

    <form id="url-form" class="url-input-group">
      <div style="display: flex; flex-direction: column; width: 100%; gap: 8px;">
          <div style="display: flex; gap: 8px;">
              <input type="text" id="url-input" placeholder="example.com" required style="flex: 1;">
              <button type="submit" class="btn primary">Load URL</button>
          </div>
      </div>
    </form>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <button id="add-custom-btn" class="btn primary highlight-btn" style="width: 100%; margin-bottom: 20px;">
        + Add Custom Size
      </button>

      <div class="device-category" id="cat-desktop">
        <h3>Desktop</h3>
        <button class="device-btn" data-width="1920" data-height="1080">1920 x 1080 (FHD)</button>
        <button class="device-btn" data-width="1440" data-height="900">1440 x 900 (MacBook)</button>
        <button class="device-btn" data-width="1366" data-height="768">1366 x 768 (HD)</button>
      </div>

      <div class="device-category" id="cat-iphone">
        <h3>iPhone</h3>
        <button class="device-btn" data-width="430" data-height="932">iPhone 14 Pro Max</button>
        <button class="device-btn active" data-width="390" data-height="844">iPhone 13</button>
        <button class="device-btn" data-width="375" data-height="667">iPhone SE / 8</button>
      </div>

      <div class="device-category" id="cat-android">
        <h3>Android</h3>
        <button class="device-btn" data-width="412" data-height="915">Pixel 7</button>
        <button class="device-btn" data-width="360" data-height="800">Samsung S22</button>
        <button class="device-btn" data-width="384" data-height="854">Generic Android</button>
      </div>

      <div class="device-category" id="cat-ipad">
        <h3>iPad / Tab</h3>
        <button class="device-btn" data-width="1024" data-height="1366">iPad Pro 12.9"</button>
        <button class="device-btn" data-width="810" data-height="1080">iPad (9th Gen)</button>
        <button class="device-btn" data-width="768" data-height="1024">iPad Mini</button>
        <button class="device-btn" data-width="800" data-height="1280">Galaxy Tab S8</button>
      </div>
    </aside>

    <main class="preview-area">
      <div class="preview-header">
        <span id="current-res">390 x 844</span>
        <span class="zoom-controls">
          Scale: <span id="scale-value">100%</span>
        </span>
        <button id="rotate-btn" class="btn outline" style="padding: 4px 8px; margin-left: 10px;"
          title="Rotate Device (Portrait/Landscape)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
      <div class="iframe-wrapper">
        <div id="iframe-container" style="width: 390px; height: 844px; position: relative;">
          <iframe id="preview-frame" src="about:blank" frameborder="0"></iframe>
          <div id="loading-overlay" class="loading-overlay hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

    <!-- Copyright Footer -->
    <footer style="position: fixed; bottom: 0; width: 100%; text-align: center; padding: 8px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-secondary); z-index: 50;">
        &copy; 2026 Pixel Panga Tech
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">Notification</div>

    <!-- Custom Size Modal -->
    <div id="custom-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Custom Size</h2>
                <button id="close-modal" class="close-btn">&times;</button>
            </div>
            <form id="custom-size-form">
                <div class="form-group">
                    <label>Category</label>
                    <select id="custom-cat" required>
                        <option value="cat-desktop">Desktop</option>
                        <option value="cat-iphone">iPhone</option>
                        <option value="cat-android">Android</option>
                        <option value="cat-ipad">iPad / Tab</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Label (e.g., My Phone)</label>
                    <input type="text" id="custom-label" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Width (px)</label>
                        <input type="number" id="custom-width" min="100" max="5000" required>
                    </div>
                    <div class="form-group">
                        <label>Height (px)</label>
                        <input type="number" id="custom-height" min="100" max="5000" required>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-modal" class="btn outline">Cancel</button>
                    <button type="submit" class="btn primary">Save Size</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
