<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResponsiveLab</title>
  <link rel="icon" type="image/png" href="images/fav.png">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <div class="logo" style="display: flex; align-items: center; gap: 12px;">
      <button id="mobile-menu-btn" class="btn outline" style="display: none; padding: 4px; margin-right: 4px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <img src="images/Logo.png" alt="ResponsiveLab Logo" style="height: 40px; width: auto; border-radius: 4px;">

      <div style="display: flex; flex-direction: column; justify-content: center;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <h1 style="font-size: 1.25rem; margin: 0; line-height: 1;">ResponsiveLab</h1>
          <span
            style="font-size: 0.65rem; padding: 2px 6px; background-color: var(--accent); color: white; border-radius: 4px; font-weight: 600;">v3.0</span>
        </div>
        <span style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 4px; line-height: 1;">Test. Preview.
          Perfect.</span>
      </div>
    </div>

    <form id="url-form" class="url-input-group"
      style="position: absolute; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px;">
      <div style="display: flex; flex-direction: column; width: 100%; gap: 8px;">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="url-input" placeholder="example.com" required style="flex: 1;">
          <button type="submit" class="btn primary">Load URL</button>
        </div>
      </div>
    </form>

    <div class="topbar-actions" style="display: flex; gap: 8px; margin-left: auto;">
      <button id="qr-btn" class="btn outline" title="Generate QR Code">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
      <button id="theme-toggle-btn" class="btn outline" title="Toggle Light/Dark Mode">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <div class="main-container">
    <aside class="sidebar">
      <div class="sidebar-mobile-header">
        <h2 style="font-size: 1.1rem; margin: 0;">Devices</h2>
        <button id="close-sidebar-btn" class="btn outline" style="padding: 4px; border: none;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <button id="add-custom-btn" class="btn primary highlight-btn" style="width: 100%; margin-bottom: 20px;">
        + Add Custom Size
      </button>

      <div class="device-category" id="cat-workspaces">
        <h3>Workspaces</h3>
        <button id="save-workspace-btn" class="btn outline"
          style="width: 100%; margin-bottom: 10px; font-size: 0.8rem; padding: 6px;">
          Save Current Grid
        </button>
        <div id="workspaces-list" style="display: flex; flex-direction: column; gap: 4px;">
          <!-- Workspaces appended here -->
        </div>
      </div>

      <div class="device-category" id="cat-desktop">
        <h3>Desktop</h3>
        <button class="device-btn" data-width="1920" data-height="1080">1920 x 1080 (FHD)</button>
        <button class="device-btn" data-width="1440" data-height="900">1440 x 900 (MacBook)</button>
        <button class="device-btn" data-width="1366" data-height="768">1366 x 768 (HD)</button>
      </div>

      <div class="device-category" id="cat-iphone">
        <h3>iPhone</h3>
        <button class="device-btn" data-width="430" data-height="932">iPhone 14 Pro Max</button>
        <button class="device-btn active" data-width="390" data-height="844">iPhone 13</button>
        <button class="device-btn" data-width="375" data-height="667">iPhone SE / 8</button>
      </div>

      <div class="device-category" id="cat-android">
        <h3>Android</h3>
        <button class="device-btn" data-width="412" data-height="915">Pixel 7</button>
        <button class="device-btn" data-width="360" data-height="800">Samsung S22</button>
        <button class="device-btn" data-width="384" data-height="854">Generic Android</button>
      </div>

      <div class="device-category" id="cat-ipad">
        <h3>iPad / Tab</h3>
        <button class="device-btn" data-width="1024" data-height="1366">iPad Pro 12.9"</button>
        <button class="device-btn" data-width="810" data-height="1080">iPad (9th Gen)</button>
        <button class="device-btn" data-width="768" data-height="1024">iPad Mini</button>
        <button class="device-btn" data-width="800" data-height="1280">Galaxy Tab S8</button>
      </div>
    </aside>

    <main class="preview-area">
      <div class="ruler-container">
        <div class="ruler-top"></div>
        <div class="ruler-content">
          <div class="ruler-left"></div>
          <div class="iframe-wrapper" id="devices-grid">
            <!-- Dynamic Device Wrappers go here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Copyright Footer -->
  <!--<footer
    style="position: fixed; bottom: 0; width: 100%; text-align: center; padding: 8px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-secondary); z-index: 50;">
    &copy; 2026 PixelPanga Tech
  </footer> -->
  <footer
    style="position: fixed; bottom: 0; width: 100%; text-align: center; padding: 8px; background-color: var(--panel-bg); border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-secondary); z-index: 50;">
    &copy; 2026 Innovana Group
  </footer>

  <!-- Notification Toast -->
  <div id="toast" class="toast hidden">Notification</div>

  <!-- Custom Size Modal -->
  <div id="custom-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Add Custom Size</h2>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <form id="custom-size-form">
        <div class="form-group">
          <label>Category</label>
          <select id="custom-cat" required>
            <option value="cat-desktop">Desktop</option>
            <option value="cat-iphone">iPhone</option>
            <option value="cat-android">Android</option>
            <option value="cat-ipad">iPad / Tab</option>
          </select>
        </div>
        <div class="form-group">
          <label>Label (e.g., My Phone)</label>
          <input type="text" id="custom-label" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Width (px)</label>
            <input type="number" id="custom-width" min="100" max="5000" required>
          </div>
          <div class="form-group">
            <label>Height (px)</label>
            <input type="number" id="custom-height" min="100" max="5000" required>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-modal" class="btn outline">Cancel</button>
          <button type="submit" class="btn primary">Save Size</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Save Workspace Modal -->
  <div id="workspace-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Save Workspace</h2>
        <button id="close-workspace-modal" class="close-btn">&times;</button>
      </div>
      <form id="workspace-form">
        <div class="form-group">
          <label>Workspace Name (e.g., Apple Devices)</label>
          <input type="text" id="workspace-name" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="cancel-workspace-modal" class="btn outline">Cancel</button>
          <button type="submit" class="btn primary">Save Workspace</button>
        </div>
      </form>
    </div>
  </div>

  <!-- QR Code Modal -->
  <div id="qr-modal" class="modal hidden">
    <div class="modal-content" style="max-width: 300px; text-align: center;">
      <div class="modal-header">
        <h2>Scan to Test</h2>
        <button id="close-qr-modal" class="close-btn">&times;</button>
      </div>
      <div style="padding: 20px;">
        <img id="qr-image" src="" alt="QR Code" style="max-width: 100%; display: none; margin: 0 auto;">
        <p id="qr-placeholder" style="color: var(--text-secondary); font-size: 0.9rem;">Enter a URL first to generate a
          QR code.</p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>

</html>
